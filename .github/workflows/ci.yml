# CI: provera koda pre merge-a. Ne šalje ništa na Azure.
# Pokreće se na svakom pull requestu ka main ili develop.

name: CI

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: "npm"

      - name: Install, lint, and build
        run: |
          npm ci
          npm run lint
          npm run build
